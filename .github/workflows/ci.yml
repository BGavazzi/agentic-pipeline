name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pyyaml

      - name: Run test suite
        run: pytest tests/ -v

      - name: Validate task schema (dogfood)
        run: python scripts/validate_task.py .docs/tasks

      - name: Validate closure law compliance (dogfood)
        run: python scripts/validate_closure.py .docs/tasks
