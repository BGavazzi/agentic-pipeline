name: Protected policy integrity

on:
  pull_request_target:

# This caller is intentionally metadata-only. It never checks out or executes
# candidate code. Keep the immutable SHA literal in the default-branch file;
# a candidate PR cannot replace this workflow before the protected check runs.
permissions:
  contents: read
  pull-requests: read

jobs:
  protected-policy:
    uses: BGavazzi/agentic-pipeline/.github/workflows/policy-gate-reusable.yml@c5803e4fcd50ef0d646b55823959390a8f54b4f8
    with:
      core_ref: c5803e4fcd50ef0d646b55823959390a8f54b4f8
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      task_id: policy-${{ github.event.pull_request.number }}
