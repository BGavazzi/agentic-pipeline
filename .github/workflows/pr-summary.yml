name: Trusted PR summary publisher
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout and no execution of candidate scripts or artifact content.
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.event !== 'pull_request' || run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) return;
            for (const candidate of run.pull_requests) {
              const {owner, repo} = context.repo;
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: candidate.number});
              if (pr.state !== 'open' || pr.head.sha !== run.head_sha) continue;
              const marker = '<!-- agentic-pipeline-pr-intelligence -->';
              const body = `${marker}\n## Agentic quality evidence\n\nCommit: \`${run.head_sha}\`\n\nCI conclusion: **${run.conclusion}**. [Risk, blast radius, contact surfaces and gate receipts](${run.html_url}).\n\nThis links candidate-run diagnostics; only trusted required checks can authorize promotion.`;
              const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: pr.number, per_page: 100});
              const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body?.includes(marker));
              const {data: latest} = await github.rest.pulls.get({owner, repo, pull_number: pr.number});
              if (latest.head.sha !== run.head_sha) continue;
              if (existing) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
              else await github.rest.issues.createComment({owner, repo, issue_number: pr.number, body});
            }
