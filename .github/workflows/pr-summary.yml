name: Trusted PR summary publisher
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout and no execution of candidate scripts or artifact content.
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.event !== 'pull_request' || run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) return;
            for (const candidate of run.pull_requests) {
              const {owner, repo} = context.repo;
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: candidate.number});
              if (pr.state !== 'open' || pr.head.sha !== run.head_sha) continue;
              const marker = '<!-- agentic-pipeline-pr-intelligence -->';
              const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: candidate.number, per_page: 100});
              if (files.length !== pr.changed_files) throw new Error('Incomplete diff inventory');
              const sensitive = /(^scripts\/|^\.github\/|^\.claude\/skills\/|(^|\/)(auth|security|infra|terraform|migrations|schema)(\/|\.)|\.tf$)/i;
              const impactful = files.some(f => sensitive.test(f.filename) || sensitive.test(f.previous_filename || '')) || pr.additions + pr.deletions >= 400;
              const surfaces = new Set();
              for (const file of files) {
                const path = file.filename;
                if (/^\.github\/|^scripts\//i.test(path)) surfaces.add('harness/CI');
                if (/(^|\/)(auth|security|secrets?)(\/|[_.-])/i.test(path)) surfaces.add('security/identity');
                if (/(^|\/)(schema|migrations?|.*\.sql$)/i.test(path)) surfaces.add('data/schema');
                if (/(^|\/)(infra|terraform|helm|charts?)(\/|[_.-])/i.test(path)) surfaces.add('infrastructure');
                if (/(^|\/)(ui|web|frontend|playwright|components?)(\/|[_.-])/i.test(path)) surfaces.add('UI/visual');
              }
              const contact = [...surfaces].sort().join(', ') || 'application/source';
              const hitl = impactful ? 'REQUIRED before staging' : 'standard review';
              const diagnostic = `[risk, blast radius, contact surfaces and gate receipts](${run.html_url})`;
              const body = `${marker}\n## Agentic quality evidence\n\n| Signal | Value |\n|---|---|\n| Candidate | \`${run.head_sha}\` |\n| Base | \`${pr.base.sha}\` |\n| Changed files | ${pr.changed_files} |\n| Diff churn | ${pr.additions + pr.deletions} (+${pr.additions} / -${pr.deletions}) |\n| Deterministic HITL | **${hitl}** |\n| Contact surfaces | ${contact} |\n| CI conclusion | **${run.conclusion}** |\n\n${diagnostic}. This summary is advisory; only trusted required checks can authorize promotion.`;
              const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: pr.number, per_page: 100});
              const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body?.includes(marker));
              const {data: latest} = await github.rest.pulls.get({owner, repo, pull_number: pr.number});
              if (latest.head.sha !== run.head_sha) continue;
              if (existing) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
              else await github.rest.issues.createComment({owner, repo, issue_number: pr.number, body});
            }
